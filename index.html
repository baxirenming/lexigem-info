  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="英语词本支持首页">
        <img src="icon.png" alt="" width="48" height="48">
        <span>英语词本</span>
      </a>
      <nav aria-label="页面导航">
        <a href="./" aria-current="page">支持</a>
        <a href="privacy.html">隐私政策</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <h1>支持</h1>
    <p class="lead">关于词本、学习记录、发音或内容错误，请发邮件联系我们。</p>
    <p><a class="email" href="mailto:wlzzjhnzwm@gmail.com">wlzzjhnzwm@gmail.com</a></p>

    <section aria-labelledby="progress">
      <h2 id="progress">学习记录</h2>
      <p>学习进度保存在设备上。你可以在应用的“我的”页面导出学习记录，并在需要时手动导入。导入会替换当前设备上的相应记录，请先保留自己的备份。</p>
    </section>
    <section aria-labelledby="audio">
      <h2 id="audio">发音</h2>
      <p>单词和句子的朗读使用设备上的 Apple 系统语音。可在应用内切换美音、英音并调整语速；可用声音和音质取决于设备上安装的语音资源。</p>
    </section>
    <section aria-labelledby="content">
      <h2 id="content">反馈词汇内容</h2>
      <p>如发现释义、例句或发音标注有误，请在邮件中写明词头、所属词本和具体问题。请勿发送密码、验证码或不必要的个人学习记录。</p>
    </section>
  </main>
  <footer class="wrap">
    <span>英语词本</span>
    <a href="privacy.html">隐私政策</a>
  </footer>
